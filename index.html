/* Lumi Fox - Gem Cascade : original game engine and rules */
(function(root){
const COLS=6,ROWS=5,SCATTER=7,ORB=8;
const PAY={0:[.05,.15,.40],1:[.06,.20,.50],2:[.08,.25,.65],3:[.10,.30,.85],4:[.15,.50,1.50],5:[.30,1,3.5],6:[.70,2.5,9]};
const PAY_SCALE=.72;for(const k in PAY)PAY[k]=PAY[k].map(x=>+(x*PAY_SCALE).toFixed(3));
const SCATTER_PAY={4:3,5:5,6:100},ORB_VALUES=[2,2,2,3,3,4,5,5,6,8,10,12,15,20,25,50,100],MAX_STEPS=60;
const WEIGHTS={base:[14,13,12,11,8,6,4,.95,.25],free:[14,13,12,11,8,6,4,.6,.45]};
function pickSymbol(rng,mode){const w=WEIGHTS[mode];let total=w.reduce((a,b)=>a+b,0),r=rng()*total;for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return 0}
function newCell(rng,mode){const s=pickSymbol(rng,mode);return{s,v:s===ORB?ORB_VALUES[Math.floor(rng()*ORB_VALUES.length)]:0}}
function newGrid(rng,mode){return Array.from({length:COLS},()=>Array.from({length:ROWS},()=>newCell(rng,mode)))}
function tierIndex(n){return n>=12?2:n>=10?1:0}
function findWins(grid){const pos={};for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const s=grid[c][r].s;if(s<=6)(pos[s]=pos[s]||[]).push([c,r])}const wins=[];for(const k in pos){const n=pos[k].length;if(n>=8)wins.push({s:+k,cells:pos[k],count:n,tier:tierIndex(n)})}return wins}
function playSpin(opts){opts=opts||{};const mode=opts.mode||'base',rng=Math.random;let grid=newGrid(rng,mode),steps=[],rawWin=0,orbSum=0,scatterCount=0,scatterWin=0;for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)if(grid[c][r].s===SCATTER)scatterCount++;if(SCATTER_PAY[scatterCount])scatterWin=SCATTER_PAY[scatterCount];let step=0;while(step<MAX_STEPS){const wins=findWins(grid);if(!wins.length)break;const removed=[],seen={};let stepWin=0;for(const w of wins){stepWin+=PAY[w.s][w.tier];for(const p of w.cells){const key=p[0]+','+p[1];if(!seen[key]){seen[key]=1;removed.push(p)}}}rawWin+=stepWin;for(let c=0;c<COLS;c++){const kept=[];for(let r=ROWS-1;r>=0;r--)if(!seen[c+','+r])kept.push(grid[c][r]);while(kept.length<ROWS)kept.push(newCell(rng,mode));for(let r=ROWS-1;r>=0;r--)grid[c][r]=kept[ROWS-1-r]}steps.push({removed,stepWin,grid:grid.map(col=>col.map(x=>({...x})))});step++}
let orbCells=[];for(const col of grid)for(const cell of col)if(cell.s===ORB){orbSum+=cell.v;orbCells.push(cell.v)}
const mult=mode==='free'?Math.max(1,(opts.freeMult||0)+orbSum):Math.max(1,orbSum);
return{initial:newGridForInitial(steps,grid),steps,rawWin,scatterCount,scatterWin,orbSum,mult,newFreeMult:(opts.freeMult||0)+orbSum,totalWin:rawWin*mult,final:grid}}
function newGridForInitial(steps,final){return steps.length?steps[0].grid.map(col=>col.map(x=>({...x}))):final.map(col=>col.map(x=>({...x})))}
const api={COLS,ROWS,playSpin};if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.LumiEngine=api;
})(typeof window!=='undefined'?window:globalThis);
</script>

function mkCell(d,c,r,delay,fromTop){const ty=GY+r*CELL+CELL/2;return{s:d.s,v:d.v,c,r,x:GX+c*CELL+CELL/2,y:fromTop?ty-(ROWS*CELL+260+r*40):ty,ty,vy:0,delay:delay||0,sc:1,alpha:1,pop:0,glow:0,landed:!fromTop}}

const wait=ms=>new Promise(r=>setTimeout(r,S.turbo?ms*.45:ms)),waitSettled=()=>new Promise(res=>{const iv=setInterval(()=>{if(S.settled&&S.cells.every(c=>c.delay<=0)){clearInterval(iv);res()}},16)});

async function runSpin(mode){const res=E.playSpin({mode,freeMult:S.freeMult});await animateSpin(res);await endSpinOrbs(res);if(mode==='free')S.freeMult=res.newFreeMult;const win=res.totalWin*bet();if(res.scatterWin>0&&win>0)addPopup('SCATTER +'+fmt(res.scatterWin*bet()),GX+GW/2,GY+GH/2+70,'#fff');return{res,win}}
async function doSpin(){if(S.busy)return;if(S.credit<bet()){setMsg('YETERSİZ KREDİ');if(S.credit<BETS[0])offerReset();return}S.busy=true;S.credit-=bet();S.lastWin=0;save();S.mode='base';S.freeMult=0;setMsg('İYİ ŞANSLAR!');const out=await runSpin('base');S.credit+=out.win;S.lastWin=out.win;save();const lbl=winLabel(out.res.totalWin);if(out.win>0){sfx.win();setMsg('KAZANÇ '+fmt(out.win)+' ₺')}else setMsg('BAHİSLERİNİZİ KOYUN!');if(lbl){sfx.big();await showOverlay({kind:'big',title:lbl,amount:out.win,x:out.res.totalWin})}if(out.res.scatterCount>=4)await startFree(15,false);S.busy=false;if(S.auto)setTimeout(()=>{if(S.auto&&!S.busy)doSpin()},S.turbo?200:500)}
async function startFree(n,bought){sfx.big();await showOverlay({kind:'free',title:'TEBRİKLER',sub:'KAZANDINIZ',big:String(n),sub2:'ÜCRETSİZ DÖNÜŞ'});S.mode='free';S.freeLeft=n;S.freeMult=0;S.freeTotal=0;while(S.freeLeft>0){S.freeLeft--;setMsg('ÜCRETSİZ DÖNÜŞ • KALAN '+S.freeLeft);const out=await runSpin('free');S.freeTotal+=out.win;S.lastWin=S.freeTotal;if(out.win>0)sfx.win();if(out.res.scatterCount>=4){S.freeLeft+=5;sfx.big();await showOverlay({kind:'retrig',title:'EKSTRA DÖNÜŞ',big:'+5'})}await wait(350)}S.credit+=S.freeTotal;save();sfx.big();await showOverlay({kind:'freeEnd',title:'BONUS BİTTİ',amount:S.freeTotal,x:S.freeTotal/bet()});S.mode='base';S.freeMult=0;setMsg('BAHİSLERİNİZİ KOYUN!')}
async function buyBonus(){if(S.busy)return;const cost=bet()*BUY_COST;if(S.credit<cost){setMsg('YETERSİZ KREDİ');return}S.busy=true;S.credit-=cost;save();S.lastWin=0;await startFree(15,true);S.busy=false}
function offerReset(){S.credit=START_CREDIT;save();setMsg('DEMO KREDİSİ YENİLENDİ')}

function hitRect(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h}function hitCircle(b,x,y){return(x-b.x)**2+(y-b.y)**2<=(b.r+8)**2}
function drawPill(b,label,on){rr(b.x,b.y,b.w,b.h,16);ctx.fillStyle=on?'#ffbd43':'rgba(40,18,90,.9)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ffe4a0';ctx.stroke();txt(label,b.x+b.w/2,b.y+b.h/2+1,22,on?'#3a1500':'#f4e9ff')}
function draw(){

ctx.fillStyle='rgba(20,8,60,.72)';ctx.fillRect(0,248,W,40);txt(S.msg,W/2,268,S.msg.length>34?19:23,'#fff3b0');
rr(GX-14,GY-14,GW+28,GH+28,22);ctx.fillStyle='rgba(14,6,50,.88)';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#f5c85c';ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#fff1b0';ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(GX,GY,GW,GH);ctx.clip();ctx.fillStyle='rgba(13,11,62,.4)';ctx.fillRect(GX,GY,GW,GH);ctx.strokeStyle='rgba(190,155,255,.32)';ctx.lineWidth=2;for(let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(GX+i*CELL,GY);ctx.lineTo(GX+i*CELL,GY+GH);ctx.stroke()}for(let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(GX,GY+i*CELL);ctx.lineTo(GX+GW,GY+i*CELL);ctx.stroke()}for(const c of S.cells){if(c.delay>0&&c.y<GY-50)continue;ctx.save();ctx.globalAlpha=c.alpha;ctx.translate(c.x,c.y);ctx.scale(c.sc,c.sc);if(c.glow&&S.glowing)glow(0,0,CELL*.75,'#fff6a0',.6+.4*Math.sin(S.t*20));drawSymbol(c.s,0,0,CELL*.38,S.t,c.v);ctx.restore()}ctx.restore();
S.popups.forEach(p=>{const k=p.t/p.life;ctx.globalAlpha=1-Math.pow(k,3);txt(p.text,p.x,p.y-k*70,54,p.col,{stroke:'#4a1470',sw:10});ctx.globalAlpha=1});
if(S.mode==='free'){rr(36,810,230,64,14);ctx.fillStyle='rgba(60,20,120,.95)';ctx.fill();ctx.strokeStyle='#ffcf5a';ctx.lineWidth=4;ctx.stroke();txt('KALAN: '+S.freeLeft,151,830,24,'#fff');txt('ÇARPAN: x'+Math.max(S.freeMult,0),151,857,24,'#ff9bf0');rr(454,810,230,64,14);ctx.fillStyle='rgba(60,20,120,.95)';ctx.fill();ctx.stroke();txt('BONUS KAZANCI',569,830,20,'#ffe9a8');txt(fmt(S.freeTotal)+' ₺',569,857,26,'#fff')}

rr(454,884,230,92,18);ctx.fillStyle='#4b1594';ctx.fill();ctx.strokeStyle='#f5c85c';ctx.lineWidth=4;ctx.stroke();txt('SON KAZANÇ',569,910,22,'#ffe9a8');txt(fmt(S.lastWin)+' ₺',569,950,34,'#fff');

const sb=BTN.spin;ctx.save();glow(sb.x,sb.y,sb.r*1.5,'#ff9bf0',S.busy?.2:.5+.2*Math.sin(S.t*3));ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r,0,Math.PI*2);ctx.fillStyle=rg(sb.x,sb.y,sb.r,'#fff2b0','#b42bc8');ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#fff0b5';ctx.stroke();ctx.translate(sb.x,sb.y);ctx.rotate(S.spinAngle);ctx.lineWidth=12;ctx.lineCap='round';ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,38,.35,Math.PI*1.65);ctx.stroke();ctx.fillStyle='#fff';poly([[38,-4],[58,-10],[44,16]]);ctx.fill();ctx.restore();
drawPill(BTN.turbo,'TURBO',S.turbo);drawPill(BTN.auto,'OTO',S.auto);drawPill(BTN.snd,S.sound?'SES ✓':'SES ✗',S.sound);drawPill(BTN.reset,'YENİLE',false);
ctx.fillStyle='rgba(10,4,34,.92)';ctx.fillRect(0,1228,W,52);txt('KREDİ',140,1254,24,'#ffcf5a',{align:'right'});txt(fmt(S.credit)+' ₺',150,1254,28,'#fff',{align:'left'});txt('BAHİS',470,1254,24,'#ffcf5a',{align:'right'});txt(fmt(bet())+' ₺',480,1254,28,'#fff',{align:'left'});txt('DEMO • SANAL KREDİ • GERÇEK PARA YOKTUR',W/2,1210,16,'rgba(255,255,255,.7)',{weight:'600'});
if(S.overlay){const o=S.overlay;o.t+=1/60;ctx.fillStyle='rgba(8,2,30,.8)';ctx.fillRect(0,0,W,H);const sc=Math.min(1,.6+o.t*1.2);ctx.save();ctx.translate(W/2,560);ctx.scale(sc,sc);rr(-290,-250,580,500,36);ctx.fillStyle=rg(0,-60,300,'#9a3cf0','#25105d');ctx.fill();ctx.lineWidth=10;ctx.strokeStyle='#f5c85c';ctx.stroke();txt(o.title,0,-170,o.title.length>12?52:64,'#ffe08a',{stroke:'#4a1470',sw:12});if(o.kind==='free'){txt(o.sub,0,-95,36,'#ffd1f6');rr(-150,-50,300,120,22);ctx.fillStyle='#2a3fd0';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();txt(o.big,0,12,100,'#fff',{stroke:'#12206a',sw:10});txt(o.sub2,0,125,46,'#ffe08a',{stroke:'#4a1470',sw:9})}else if(o.kind==='retrig'){txt(o.big,0,0,150,'#fff',{stroke:'#4a1470',sw:14});txt('ÜCRETSİZ DÖNÜŞ',0,110,40,'#ffe08a',{stroke:'#4a1470',sw:8})}else{const shown=o.amount*Math.min(1,o.t/1.2);txt(fmt(shown)+' ₺',0,-40,66,'#fff',{stroke:'#12206a',sw:12});txt('x'+(o.x>=100?fmt0(o.x*Math.min(1,o.t/1.2)):(o.x*Math.min(1,o.t/1.2)).toFixed(1))+' BAHİS',0,50,40,'#ffb3f0',{stroke:'#4a0a7a',sw:8})}if(o.t>.5)txt('DEVAM ETMEK İÇİN DOKUNUN',0,205,24,'#fff',{weight:'700'});ctx.restore()}
ctx.restore()}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function toLogical(e){const rect=cv.getBoundingClientRect();return[(e.clientX-rect.left-offX)/scale,(e.clientY-rect.top-offY)/scale]}
cv.addEventListener('pointerdown',function(e){e.preventDefault();const p=toLogical(e),x=p[0],y=p[1];if(AC&&AC.state==='suspended')AC.resume();if(S.overlay){closeOverlay();return}if(hitCircle(BTN.spin,x,y)){sfx.click();if(S.auto&&S.busy){S.auto=false;return}doSpin();return}if(hitRect(BTN.turbo,x,y)){S.turbo=!S.turbo;sfx.click();return}if(hitRect(BTN.auto,x,y)){S.auto=!S.auto;sfx.click();if(S.auto&&!S.busy)doSpin();return}if(hitRect(BTN.snd,x,y)){S.sound=!S.sound;sfx.click();return}if(hitRect(BTN.reset,x,y)){if(!S.busy)offerReset();return}if(!S.busy){if(hitCircle(BTN.minus,x,y)){S.betIdx=Math.max(0,S.betIdx-1);save();sfx.click();return}if(hitCircle(BTN.plus,x,y)){S.betIdx=Math.min(BETS.length-1,S.betIdx+1);save();sfx.click();return}if(hitRect(BTN.buy,x,y)){buyBonus();return}}},{passive:false});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(S.overlay)closeOverlay();else doSpin()}});
